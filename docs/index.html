<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LC Solutions — Yaroslav Matushevych</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f7f6f3;
      --surface:    #ffffff;
      --border:     #e8e5e0;
      --border2:    #d4d0c8;
      --text:       #1c1917;
      --text2:      #44403c;
      --muted:      #78716c;
      --indigo:     #4f46e5;
      --indigo-lt:  #eef2ff;
      --indigo-mid: #c7d2fe;
      --green:      #16a34a;
      --green-lt:   #dcfce7;
      --amber:      #d97706;
      --amber-lt:   #fef3c7;
      --red:        #dc2626;
      --red-lt:     #fee2e2;
      --radius-sm:  6px;
      --radius:     12px;
      --radius-lg:  16px;
      --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:     0 4px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
      --shadow-lg:  0 12px 40px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.06);
      --ease:       cubic-bezier(0.4, 0, 0.2, 1);
      --t:          0.2s;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(247, 246, 243, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--indigo);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg { display: block; }

    .logo-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .logo-name em {
      font-style: normal;
      color: var(--indigo);
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background var(--t) var(--ease),
                  border-color var(--t) var(--ease),
                  color var(--t) var(--ease),
                  box-shadow var(--t) var(--ease);
    }

    .btn-outline {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text2);
    }
    .btn-outline:hover {
      border-color: var(--border2);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      background: var(--indigo);
      color: #fff;
    }
    .btn-primary:hover {
      background: #4338ca;
      box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    }

    /* ── HERO ── */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2.5rem) 0;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--indigo);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: riseIn 0.5s 0.05s var(--ease) forwards;
    }

    .hero-eyebrow::before {
      content: '';
      display: block;
      width: 20px; height: 2px;
      background: var(--indigo);
      border-radius: 2px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5.5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.06;
      color: var(--text);
      max-width: 700px;
      opacity: 0;
      animation: riseIn 0.5s 0.12s var(--ease) forwards;
    }

    .hero h1 .underline-accent {
      position: relative;
      display: inline-block;
    }

    .hero h1 .underline-accent::after {
      content: '';
      position: absolute;
      left: 0; bottom: 2px;
      width: 100%; height: 4px;
      background: var(--indigo);
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left;
      animation: swipeIn 0.5s 0.55s var(--ease) forwards;
    }

    .hero-sub {
      margin-top: 0.5rem;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--muted);
      font-weight: 500;
      max-width: none;
      white-space: nowrap;
      line-height: 1.6;
      opacity: 0;
      animation: riseIn 0.5s 0.2s var(--ease) forwards;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes swipeIn {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* ── STATS ── */
    .stats-wrap {
      max-width: 1200px;
      margin: 1.5rem auto 0;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
      opacity: 0;
      animation: riseIn 0.5s 0.28s var(--ease) forwards;
    }

    .stats-row {
      display: flex;
      align-items: stretch;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .stat {
      flex: 1;
      padding: 1.4rem 1.5rem;
      text-align: center;
      position: relative;
    }

    .stat + .stat::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: var(--border);
    }

    .stat-num {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .stat-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 5px;
    }

    .stat-num { color: var(--text); }
    .stat.easy   .stat-num { color: var(--green); }
    .stat.medium .stat-num { color: var(--amber); }
    .stat.hard   .stat-num { color: var(--red); }
    .stat.langs  .stat-num { font-size: 1rem; letter-spacing: -0.01em; padding-top: 0.6rem; }

    /* ── CONTROLS ── */
    .controls-wrap {
      max-width: 1200px;
      margin: 2rem auto 0;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      opacity: 0;
      animation: riseIn 0.5s 0.36s var(--ease) forwards;
    }

    .search-field {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-field svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      outline: none;
      transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }

    .seg-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .seg-btn {
      padding: 8px 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      border-right: 1px solid var(--border);
      transition: background var(--t) var(--ease), color var(--t) var(--ease);
      white-space: nowrap;
    }
    .seg-btn:last-child { border-right: none; }
    .seg-btn:hover:not(.active) { background: var(--bg); color: var(--text2); }

    .seg-btn.active { background: var(--indigo); color: #fff; }

    /* ── RESULTS META ── */
    .results-meta {
      max-width: 1200px;
      margin: 1.25rem auto 0;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
    }
    .results-meta strong { color: var(--text2); }

    /* ── GRID ── */
    .grid {
      max-width: 1200px;
      margin: 1rem auto 0;
      padding: 0 clamp(1rem, 4vw, 2.5rem) 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--t) var(--ease),
                  box-shadow var(--t) var(--ease),
                  transform var(--t) var(--ease);
      opacity: 0;
      animation: riseIn 0.45s var(--ease) forwards;
    }
    .card:hover {
      border-color: var(--border2);
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }

    .card-watermark {
      position: absolute;
      top: -6px;
      right: 14px;
      font-size: 5.5rem;
      font-weight: 800;
      letter-spacing: -0.06em;
      color: var(--border);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      transition: color var(--t) var(--ease);
    }
    .card:hover .card-watermark { color: var(--border2); }

    .card-body {
      padding: 1.4rem 1.4rem 0.8rem;
      flex: 1;
      position: relative;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 0.8rem;
    }

    .diff-badge {
      flex-shrink: 0;
      padding: 4px 11px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 3px;
    }
    .diff-badge.easy   { background: var(--green-lt); color: var(--green); }
    .diff-badge.medium { background: var(--amber-lt); color: var(--amber); }
    .diff-badge.hard   { background: var(--red-lt);   color: var(--red); }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text);
    }

    .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }

    .lang-badge {
      padding: 4px 11px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid;
    }
    .lang-badge.python,
    .lang-badge.java,
    .lang-badge.typescript { color: var(--text2); background: var(--bg); border-color: var(--border2); }

    .approach-text {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.4;
    }

    /* ── CARD FOOTER ── */
    .card-footer {
      padding: 0.75rem 1.4rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .lc-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      transition: color var(--t) var(--ease);
    }
    .lc-link:hover { color: var(--amber); }

    .code-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 600;
      color: var(--indigo);
      background: var(--indigo-lt);
      border: 1px solid var(--indigo-mid);
      border-radius: var(--radius-sm);
      padding: 5px 12px;
      cursor: pointer;
      transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease);
    }
    .code-toggle:hover {
      background: #e0e7ff;
      box-shadow: 0 2px 8px rgba(79,70,229,0.15);
    }
    .code-toggle svg { transition: transform var(--t) var(--ease); }
    .code-toggle.open svg { transform: rotate(180deg); }

    /* ── CODE PANEL ── */
    .code-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--ease), opacity 0.3s var(--ease);
      opacity: 0;
    }
    .code-panel.open { max-height: 520px; opacity: 1; }

    .code-inner {
      border-top: 1px solid var(--border);
      position: relative;
    }

    .code-lang-pill {
      position: absolute;
      top: 10px; right: 12px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      z-index: 2;
      pointer-events: none;
    }

    .code-inner pre {
      margin: 0 !important;
      border-radius: 0 !important;
      padding: 1.1rem !important;
      font-family: 'Fira Code', monospace !important;
      font-size: 12.5px !important;
      line-height: 1.7 !important;
      background: #f6f8fa !important;
      max-height: 400px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    .code-inner pre::-webkit-scrollbar { width: 5px; }
    .code-inner pre::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── EMPTY ── */
    .empty {
      grid-column: 1 / -1;
      padding: 5rem 2rem;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty p { font-size: 14px; font-weight: 500; }

    /* ── FOOTER ── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 40;
    }

    /* prevent grid from being hidden under fixed footer */
    .grid { padding-bottom: 6rem; }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem clamp(1rem, 4vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .footer-copy { font-size: 15px; color: var(--muted); font-weight: 500; }
    .footer-copy a { color: var(--indigo); text-decoration: none; }
    .footer-copy a:hover { text-decoration: underline; }
    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a {
      font-size: 15px; color: var(--muted); text-decoration: none; font-weight: 500;
      transition: color var(--t) var(--ease);
    }
    .footer-links a:hover { color: var(--text); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .stat + .stat::before { display: none; }
      .stat { flex: 1 1 40%; border-bottom: 1px solid var(--border); }
    }
    @media (max-width: 480px) {
      .logo-name { display: none; }
      .btn-outline { display: none; }
      .seg-btn { padding: 7px 10px; font-size: 12px; }
    }
  </style>
</head>

      <div class="stat-num" id="statHard">0</div>

<div class="controls-wrap">
  <div class="search-field">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>

  <div class="seg-group" id="diffFilter">
    <button class="seg-btn active" data-diff="all">All</button>
    <button class="seg-btn easy"   data-diff="easy">Easy</button>
    <button class="seg-btn medium" data-diff="medium">Medium</button>
    <button class="seg-btn hard"   data-diff="hard">Hard</button>
  </div>

  <div class="seg-group" id="langFilter">
    <button class="seg-btn active" data-lang="all">All</button>
    <button class="seg-btn python" data-lang="python">Python</button>
    <button class="seg-btn java"   data-lang="java">Java</button>
    <button class="seg-btn ts"     data-lang="typescript">TypeScript</button>
  </div>
</div>

<p class="results-meta" id="resultsMeta"></p>

<div class="grid" id="grid"></div>

<footer>
  <div class="footer-inner">
    <p class="footer-copy">Built with ❤️ by <a href="https://github.com/YaroslavMatushevych" target="_blank">Yaroslav Matushevych</a></p>
    <div class="footer-links">
      <a href="https://github.com/YaroslavMatushevych/leetcode-solutions" target="_blank">Repository</a>
      <a href="https://leetcode.com/u/YaroslavMatushevych/" target="_blank">LeetCode Profile</a>
    </div>
  </div>
</footer>

<script>
const SOLUTIONS = [
  {
    id: 1,
    title: "Two Sum",
    difficulty: "easy",
    language: "python",
    leetcodeUrl: "https://leetcode.com/problems/two-sum/",
    approach: "Hash Map · O(n) time · O(n) space",
    code: `class Solution:
    def twoSum(self, nums: list[int], target: int) -> list[int]:
        # Store {value: index} for O(1) lookups
        seen: dict[int, int] = {}

        for i, num in enumerate(nums):
            complement = target - num
            if complement in seen:
                return [seen[complement], i]
            seen[num] = i

        return []  # guaranteed to have a solution`,
  },
  {
    id: 21,
    title: "Merge Two Sorted Lists",
    difficulty: "easy",
    language: "typescript",
    leetcodeUrl: "https://leetcode.com/problems/merge-two-sorted-lists/",
    approach: "Iterative dummy node · O(n+m) time · O(1) space",
    code: `class ListNode {
  val: number;
  next: ListNode | null;
  constructor(val = 0, next: ListNode | null = null) {
    this.val = val;
    this.next = next;
  }
}

function mergeTwoLists(
  list1: ListNode | null,
  list2: ListNode | null
): ListNode | null {
  const dummy = new ListNode(-1);
  let current = dummy;

  while (list1 !== null && list2 !== null) {
    if (list1.val <= list2.val) {
      current.next = list1;
      list1 = list1.next;
    } else {
      current.next = list2;
      list2 = list2.next;
    }
    current = current.next;
  }

  current.next = list1 ?? list2;
  return dummy.next;
}`,
  },
  {
    id: 53,
    title: "Maximum Subarray",
    difficulty: "medium",
    language: "java",
    leetcodeUrl: "https://leetcode.com/problems/maximum-subarray/",
    approach: "Kadane's Algorithm · O(n) time · O(1) space",
    code: `class Solution {
    public int maxSubArray(int[] nums) {
        // Track running max and global max
        int currentMax = nums[0];
        int globalMax  = nums[0];

        for (int i = 1; i < nums.length; i++) {
            // Extend subarray or start fresh
            currentMax = Math.max(nums[i], currentMax + nums[i]);
            globalMax  = Math.max(globalMax, currentMax);
        }

        return globalMax;
    }
}`,
  },
];

const LANG_LABELS = { python: "Python", java: "Java", typescript: "TypeScript" };

let activeDiff = "all", activeLang = "all", query = "";

function initStats() {
  const total  = SOLUTIONS.length;
  const easy   = SOLUTIONS.filter(s => s.difficulty === "easy").length;
  const medium = SOLUTIONS.filter(s => s.difficulty === "medium").length;
  const hard   = SOLUTIONS.filter(s => s.difficulty === "hard").length;
  const langs  = [...new Set(SOLUTIONS.map(s => s.language))];

  countUp("statTotal", total);
  countUp("statEasy", easy);
  countUp("statMedium", medium);
  countUp("statHard", hard);

  document.getElementById("statLangs").textContent =
    langs.map(l => LANG_LABELS[l] || l).join(" · ");
}

function countUp(id, target) {
  const el = document.getElementById(id);
  const dur = 700, start = performance.now();
  (function step(now) {
    const p = Math.min((now - start) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  })(start);
}

function getFiltered() {
  return SOLUTIONS.filter(s => {
    if (activeDiff !== "all" && s.difficulty !== activeDiff) return false;
    if (activeLang !== "all" && s.language !== activeLang) return false;
    const q = query.trim().toLowerCase();
    if (q && !String(s.id).includes(q) && !s.title.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => a.id - b.id);
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  const list = getFiltered();
  const grid = document.getElementById("grid");
  const meta = document.getElementById("resultsMeta");

  meta.innerHTML = `Showing <strong>${list.length}</strong> of <strong>${SOLUTIONS.length}</strong> solutions`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>No solutions match your filters.</p></div>`;
    return;
  }

  grid.innerHTML = list.map((s, i) => `
    <article class="card" style="animation-delay:${i * 0.07}s" data-id="${s.id}">
      <div class="card-watermark">${String(s.id).padStart(3, "0")}</div>
      <div class="card-body">
        <div class="card-top">
          <span class="diff-badge ${s.difficulty}">${s.difficulty}</span>
          <h2 class="card-title">${s.title}</h2>
        </div>
        <div class="card-badges">
          <span class="lang-badge ${s.language}">${LANG_LABELS[s.language] || s.language}</span>
        </div>
        ${s.approach ? `<p class="approach-text">${s.approach}</p>` : ""}
      </div>
      <div class="card-footer">
        <a class="lc-link" href="${s.leetcodeUrl}" target="_blank" rel="noopener">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6v2H5v11h11v-5h2v6a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1h6zm11-3v8h-2V6.413l-7.793 7.794-1.414-1.414L17.585 5H13V3h8z"/></svg>
          View on LeetCode
        </a>
        <button class="code-toggle" onclick="toggleCode(${s.id}, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
          View Code
        </button>
      </div>
      <div class="code-panel" id="code-${s.id}">
        <div class="code-inner">
          <span class="code-lang-pill">${LANG_LABELS[s.language] || s.language}</span>
          <pre><code class="language-${s.language === "typescript" ? "typescript" : s.language}">${esc(s.code)}</code></pre>
        </div>
      </div>
    </article>
  `).join("");

  grid.querySelectorAll("pre code").forEach(b => hljs.highlightElement(b));
}

function toggleCode(id, btn) {
  const panel = document.getElementById(`code-${id}`);
  const open = panel.classList.toggle("open");
  btn.classList.toggle("open", open);
  btn.innerHTML = open
    ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg> Hide Code`
    : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> View Code`;
}

document.getElementById("diffFilter").addEventListener("click", e => {
  const b = e.target.closest("[data-diff]");
  if (!b) return;
  activeDiff = b.dataset.diff;
  document.querySelectorAll("[data-diff]").forEach(x => x.classList.toggle("active", x === b));
  render();
});

document.getElementById("langFilter").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (!b) return;
  activeLang = b.dataset.lang;
  document.querySelectorAll("[data-lang]").forEach(x => x.classList.toggle("active", x === b));
  render();
});

let debounce;
document.getElementById("searchInput").addEventListener("input", e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = e.target.value; render(); }, 160);
});

initStats();
render();
</script>
</body>
</html>
